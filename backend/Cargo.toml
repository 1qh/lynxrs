[package]
name = "simu-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "simu-backend"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "=1.52.1", features = ["full"] }

# HTTP server
axum = { version = "=0.8.9", features = ["macros", "ws", "multipart"] }

tower-http = { version = "=0.6.8", features = ["cors", "trace", "compression-br", "limit", "request-id", "set-header", "timeout"] }
time = "=0.3.47"

# Cookie-based sessions (stateless, encrypted)
axum-extra = { version = "=0.12.6", features = ["cookie-private", "cookie-signed", "typed-header"] }
cookie = "=0.18.1"

# ORM (explicit features, no default MySQL/SQLite pulling rsa/legacy deps)
sea-orm = { version = "=1.1.20", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono", "with-json"] }
sea-orm-migration = { version = "=1.1.20", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "with-chrono"] }

# Serialization
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

# Error + validation
thiserror = "=2.0.18"
validator = { version = "=0.20.0", features = ["derive"] }
anyhow = "=1.0.102"

# Password hashing (RustCrypto, pure Rust)
argon2 = "=0.5.3"
password-hash = "=0.6.1"
rand_core = "=0.10.1"

# Observability
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }

# OpenTelemetry (optional, enabled via OTLP_ENDPOINT env)
opentelemetry = "=0.31.0"
opentelemetry_sdk = { version = "=0.31.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "=0.31.1", features = ["grpc-tonic", "trace"], default-features = false }
tracing-opentelemetry = "=0.32.1"

# Rate limiting
tower_governor = "=0.8.0"
axum-prometheus = "=0.10.0"
metrics = "=0.24.3"

# Email
lettre = { version = "=0.11.21", default-features = false, features = ["tokio1-rustls", "smtp-transport", "builder", "tokio1", "ring", "webpki-roots"] }

# OpenAPI (type bridge to TS frontend)
utoipa = { version = "=5.4.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "=0.2.0"

# Object storage (S3/MinIO)
object_store = { version = "=0.13.2", features = ["aws"] }

# Job queue (Postgres-backed, no Redis)

# Utility
uuid = { version = "=1.23.1", features = ["v4", "v5", "v7", "serde"] }
chrono = { version = "=0.4.44", features = ["serde"] }
dotenvy = "=0.15.7"
hex = "=0.4.3"
sha2 = "=0.11.0"
hmac = "=0.13.0"
once_cell = "=1.21.4"
async-stream = "=0.3.6"
governor = "=0.10.4"
dashmap = "=6.1.0"
regex = "=1.12.3"
bytes = "=1.11.1"
base64 = "=0.22.1"
async-trait = "=0.1.89"
futures = "=0.3.32"
totp-rs = { version = "=5.7.1", features = ["gen_secret", "otpauth"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
zip = { version = "=8.5.1", default-features = false, features = ["deflate"] }
rand = "=0.10.1"
reqwest = { version = "=0.13.2", features = ["json", "rustls", "form", "stream"], default-features = false }
async-nats = "=0.47.0"
subtle = "2.6.1"

[dev-dependencies]
tokio = { version = "=1.52.1", features = ["macros", "rt-multi-thread", "test-util"] }
testcontainers = "=0.27.3"
testcontainers-modules = { version = "=0.15.0", features = ["postgres", "minio"] }
reqwest = { version = "=0.13.2", features = ["json", "rustls", "cookies", "multipart"], default-features = false }
proptest = "=1.11.0"
tokio-tungstenite = "=0.28.0"
http = "=1.3.1"
wiremock = "=0.6.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1
