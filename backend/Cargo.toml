[package]
name = "simu-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "simu-backend"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "=1.51.1", features = ["full"] }

# HTTP server
axum = { version = "=0.8.9", features = ["macros", "ws", "multipart"] }
tower = "=0.5.3"
tower-http = { version = "=0.6.8", features = ["cors", "trace", "compression-br", "limit", "request-id", "set-header", "timeout"] }
time = "=0.3.47"

# Cookie-based sessions (stateless, encrypted)
axum-extra = { version = "=0.12.6", features = ["cookie-private", "cookie-signed", "typed-header"] }
cookie = "=0.18.1"

# ORM (explicit features, no default MySQL/SQLite pulling rsa/legacy deps)
sea-orm = { version = "=1.1.19", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono", "with-json"] }
sea-orm-migration = { version = "=1.1.19", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "with-chrono"] }

# Serialization
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

# Error + validation
thiserror = "=2.0.12"
validator = { version = "=0.20.0", features = ["derive"] }
anyhow = "=1.0.99"

# Password hashing (RustCrypto, pure Rust)
argon2 = "=0.5.3"
password-hash = "=0.5.0"
rand_core = { version = "=0.6.4", features = ["std"] }

# Observability
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }

# Rate limiting
tower_governor = "=0.8.0"
axum-prometheus = "=0.10.0"

# Email
lettre = { version = "=0.11.21", default-features = false, features = ["tokio1-rustls", "smtp-transport", "builder", "tokio1", "ring", "webpki-roots"] }

# OpenAPI (type bridge to TS frontend)
utoipa = { version = "=5.3.1", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "=0.2.0"

# Object storage (S3/MinIO)
object_store = { version = "=0.13.2", features = ["aws"] }

# Job queue (Postgres-backed, no Redis)
apalis = "=0.7.4"
apalis-sql = { version = "=0.7.4", features = ["postgres"] }

# Utility
uuid = { version = "=1.11.0", features = ["v4", "v7", "serde"] }
chrono = { version = "=0.4.38", features = ["serde"] }
dotenvy = "=0.15.7"
hex = "=0.4.3"
sha2 = "=0.10.8"
bytes = "=1.11.1"
base64 = "=0.22.1"
async-trait = "=0.1.89"
futures = "=0.3.31"

[dev-dependencies]
tokio = { version = "=1.51.1", features = ["macros", "rt-multi-thread", "test-util"] }
testcontainers = "=0.23.1"
testcontainers-modules = { version = "=0.11.4", features = ["postgres", "minio"] }
reqwest = { version = "=0.12.12", features = ["json", "rustls-tls", "cookies"], default-features = false }
proptest = "=1.6.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1
