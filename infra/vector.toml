# Ship Docker container stdout → Loki.
[api]
enabled = true
address = "0.0.0.0:8686"

[sources.docker]
type = "docker_logs"

[transforms.parse]
type = "remap"
inputs = ["docker"]
source = '''
.container = .container_name
del(.labels)
'''

[sinks.loki]
type = "loki"
inputs = ["parse"]
endpoint = "http://loki:3100"
encoding.codec = "json"
labels.container = "{{ container }}"
labels.source = "vector"
