# Compatible with Forgejo Actions / Gitea Actions / GitHub Actions.
# Place at .forgejo/workflows/ci.yml (Forgejo/Gitea) or .github/workflows/ci.yml (GitHub).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Rust backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_USER: simu
          POSTGRES_PASSWORD: simu
          POSTGRES_DB: simu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U simu" --health-interval 5s
          --health-timeout 3s --health-retries 10
      minio:
        image: minio/minio:RELEASE.2025-04-08T15-41-24Z
        env:
          MINIO_ROOT_USER: simuadmin
          MINIO_ROOT_PASSWORD: simu_dev_minio
        ports: ["9000:9000"]
        options: >-
          --health-cmd "mc ready local" --health-interval 10s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: build
        run: cargo build --locked --release

      - name: unit + integration tests
        env:
          DATABASE_URL: postgres://simu:simu@localhost:5432/simu
        run: cargo nextest run --release --locked

      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings || true

      - name: cargo-deny
        run: |
          cargo install cargo-deny --locked
          cargo deny check --config deny.toml

      - name: cargo-machete (unused deps)
        run: |
          cargo install cargo-machete --locked
          cargo machete

  frontend:
    name: Lynx frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: install
        run: bun install --no-save
      - name: typecheck
        run: bun run typecheck
      - name: build
        run: bun run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      # Backend must be up: launch infra + backend, then rspeedy, then run tests.
      # Reuse docker compose minimally; this is a placeholder job for CI wiring.
      - run: echo "Wire E2E to docker-compose up + wait-for-http + playwright test"

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
      - name: trivy fs
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
