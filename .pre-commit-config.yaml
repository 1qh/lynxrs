# Run: `pre-commit install` once, then commits will be gated.
# Hooks pinned; update with `pre-commit autoupdate`.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--config=.gitleaks.toml"]

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        language: system
        entry: bash -c 'cd backend && cargo fmt --all -- --check'
        pass_filenames: false
        files: \.rs$

      - id: cargo-clippy
        name: cargo clippy
        language: system
        entry: bash -c 'cd backend && cargo clippy --all-targets --locked -- -D warnings'
        pass_filenames: false
        files: \.rs$

      - id: tsc
        name: bun tsc --noEmit
        language: system
        entry: bash -c 'cd frontend && bun run typecheck'
        pass_filenames: false
        files: \.(ts|tsx)$

      # Spike policy: chase upstream and block commits that break parity.
      # Every commit bumps Rust pins to latest; if the bump breaks clippy or
      # builds, the commit is REJECTED (fix the breakage, then re-commit).
      - id: cargo-upgrade-latest
        name: cargo upgrade --incompatible --pinned (strict)
        language: system
        entry: bash -c '
          set -euo pipefail
          cd backend
          cargo upgrade --incompatible --pinned
          cargo clippy --release --all-targets --locked -- -D warnings
          git add Cargo.toml Cargo.lock
        '
        pass_filenames: false
        always_run: true

      - id: bun-latest
        name: bun install (latest, no lockfile commit)
        language: system
        entry: bash -c 'cd frontend && bun install --silent'
        pass_filenames: false
        always_run: true
