# Run: `pre-commit install` once, then commits will be gated.
# Hooks pinned; update with `pre-commit autoupdate`.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--config=.gitleaks.toml"]

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        language: system
        entry: bash -c 'cd backend && cargo fmt --all -- --check'
        pass_filenames: false
        files: \.rs$

      - id: cargo-clippy
        name: cargo clippy
        language: system
        entry: bash -c 'cd backend && cargo clippy --all-targets --locked -- -D warnings'
        pass_filenames: false
        files: \.rs$

      - id: tsc
        name: bun tsc --noEmit
        language: system
        entry: bash -c 'cd frontend && bun run typecheck'
        pass_filenames: false
        files: \.(ts|tsx)$

      # Spike policy: chase upstream. Every commit tries to bump Rust pins to
      # latest. If the bump still builds+lints clean, the new Cargo.toml gets
      # staged along with the commit. If the bump breaks anything, Cargo.toml
      # is reverted so the commit still goes through (warning logged).
      - id: cargo-upgrade-latest
        name: cargo upgrade --incompatible --pinned (tolerant)
        language: system
        entry: bash -c '
          set -u
          cd backend
          cp Cargo.toml Cargo.toml.bak
          cp Cargo.lock Cargo.lock.bak
          if cargo upgrade --incompatible --pinned >/dev/null 2>&1 && \
             cargo clippy --release --all-targets --locked -- -D warnings >/dev/null 2>&1; then
            rm Cargo.toml.bak Cargo.lock.bak
            git add Cargo.toml Cargo.lock
            echo "[deps] rust pins bumped"
          else
            mv Cargo.toml.bak Cargo.toml
            mv Cargo.lock.bak Cargo.lock
            echo "[deps] rust upgrade failed, keeping current pins (fix API breakage manually)"
          fi
        '
        pass_filenames: false
        always_run: true

      - id: bun-latest
        name: bun install (latest, no lockfile commit)
        language: system
        entry: bash -c 'cd frontend && bun install --silent'
        pass_filenames: false
        always_run: true
